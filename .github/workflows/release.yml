name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.1). If provided, publishes semver tags; otherwise publishes sha and latest."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: release-please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create release PRs, tags, and GitHub Releases
      pull-requests: write # Open and update the Release Please pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--main
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != '' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Synchronize uv.lock on release PR
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv lock
          if ! git diff --quiet uv.lock; then
            echo "Synchronizing uv.lock on release-please--branches--main..."
            git add uv.lock
            git commit -m "chore: synchronize uv.lock for release"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:release-please--branches--main
          else
            echo "uv.lock is already synchronized."
          fi

  publish-image:
    name: publish-image
    needs: [release-please]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # Attach digests / notes to the GitHub Release when present
      packages: write # Push container images to GHCR
      actions: write # Write Actions cache for Docker layer reuse
      id-token: write # Cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.sha) || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Resolve release metadata
        id: release-info
        env:
          DISPATCH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          IS_RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "candidate_ghcr=ghcr.io/andrewtryder/unifi-netwatcher:candidate-${short_sha}" >> "$GITHUB_OUTPUT"

          target_tag=""
          if [ "${IS_RELEASE_CREATED}" = "true" ] && [ -n "${RELEASE_TAG}" ]; then
            target_tag="${RELEASE_TAG}"
          elif [ -n "${DISPATCH_TAG}" ]; then
            target_tag="${DISPATCH_TAG}"
          fi

          if [ -n "${target_tag}" ]; then
            echo "target_tag=${target_tag}" >> "$GITHUB_OUTPUT"
            echo "is_semver_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "target_tag=" >> "$GITHUB_OUTPUT"
            echo "is_semver_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/andrewtryder/unifi-netwatcher
            andrewtryder/unifi-netwatcher
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release-info.outputs.target_tag }},enable=${{ steps.release-info.outputs.is_semver_release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release-info.outputs.target_tag }},enable=${{ steps.release-info.outputs.is_semver_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.release-info.outputs.is_semver_release == 'true' }}
            type=sha,format=short,enable=${{ steps.release-info.outputs.is_semver_release != 'true' }}
            type=raw,value=latest,enable=${{ steps.release-info.outputs.is_semver_release != 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release-info.outputs.head_sha }}

      - name: Assert expected release tags
        if: ${{ steps.release-info.outputs.is_semver_release == 'true' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_TAG: ${{ steps.release-info.outputs.target_tag }}
        run: |
          set -euo pipefail
          echo "Generated tags:"
          printf '%s\n' "${TAGS}"

          # Strip leading 'v' if present
          clean_ver="${EXPECTED_TAG#v}"

          for prefix in "ghcr.io/andrewtryder/unifi-netwatcher" "andrewtryder/unifi-netwatcher"; do
            if ! printf '%s\n' "${TAGS}" | grep -q "^${prefix}:${clean_ver}$"; then
              echo "Assertion failed: Missing expected version tag '${prefix}:${clean_ver}'" >&2
              exit 1
            fi
            if ! printf '%s\n' "${TAGS}" | grep -q "^${prefix}:latest$"; then
              echo "Assertion failed: Missing expected tag '${prefix}:latest'" >&2
              exit 1
            fi
          done
          echo "Assertion passed: Expected release tags are present."

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release-info.outputs.candidate_ghcr }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/andrewtryder/unifi-netwatcher@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Promote verified digest to release tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          src="ghcr.io/andrewtryder/unifi-netwatcher@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker buildx imagetools create --tag "${tag}" "${src}"
          done <<< "${TAGS}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for image in ghcr.io/andrewtryder/unifi-netwatcher andrewtryder/unifi-netwatcher; do
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Publish digest to release notes
        if: ${{ steps.release-info.outputs.is_semver_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-info.outputs.target_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$(gh release view "$TAG" --json body -q .body)"
          {
            printf '%s\n\n' "$notes"
            echo "### Container image"
            echo "Prefer a versioned tag or digest for production (avoid relying on \`latest\` alone)."
            echo ""
            echo "\`ghcr.io/andrewtryder/unifi-netwatcher@${DIGEST}\`"
          } > /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md
