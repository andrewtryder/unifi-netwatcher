name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Contents read is enough for checkout, tests, and workflow linting.
permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check app tests

      - name: Ruff format
        run: uv run ruff format --check app tests

      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements-audit.txt
          uv run --with pip-audit pip-audit -r /tmp/requirements-audit.txt

      - name: Alembic upgrade head
        run: |
          mkdir -p /tmp/nw-migrate
          DATABASE_URL=sqlite:////tmp/nw-migrate/ci.db uv run alembic upgrade head
          DATABASE_URL=sqlite:////tmp/nw-migrate/ci2.db uv run alembic upgrade 84d6a692d6a4
          DATABASE_URL=sqlite:////tmp/nw-migrate/ci2.db uv run alembic upgrade head

      - name: Semgrep
        # Official image avoids uvx/semgrep breaking on the runner's default Python (e.g. 3.14).
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            semgrep/semgrep:1.110.0@sha256:a147965cd455dd773f639b09c53b1428aa2d24f1c3459ca203a8ce84845e8f18 \
            semgrep scan --config p/owasp-top-ten --config p/python --error --quiet /src/app

      - name: Pytest
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install and build CSS
        run: npm ci && npm run build:css

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # Write Actions cache for Docker layer reuse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: unifi-netwatcher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  actions-lint:
    name: actions-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run zizmor
        run: uvx zizmor@1.9.0 --persona pedantic .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
