name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Contents read is enough for checkout, tests, and workflow linting.
permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check app tests

      - name: Ruff format
        run: uv run ruff format --check app tests

      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements-audit.txt
          uv run --with pip-audit pip-audit -r /tmp/requirements-audit.txt

      - name: Alembic upgrade head
        run: |
          mkdir -p /tmp/nw-migrate
          DATABASE_URL=sqlite:////tmp/nw-migrate/ci.db uv run alembic upgrade head
          DATABASE_URL=sqlite:////tmp/nw-migrate/ci2.db uv run alembic upgrade 84d6a692d6a4
          DATABASE_URL=sqlite:////tmp/nw-migrate/ci2.db uv run alembic upgrade head

      - name: Semgrep
        # Official image avoids uvx/semgrep breaking on the runner's default Python (e.g. 3.14).
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            semgrep/semgrep:1.110.0@sha256:a147965cd455dd773f639b09c53b1428aa2d24f1c3459ca203a8ce84845e8f18 \
            semgrep scan --config p/owasp-top-ten --config p/python --error --quiet /src/app

      - name: Pytest
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install and build CSS
        run: npm ci && npm run build:css

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # Write Actions cache for Docker layer reuse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: unifi-netwatcher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and load smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: unifi-netwatcher:ci-smoke
          cache-from: type=gha

      - name: Runtime smoke (entrypoint, migrate, /readyz)
        run: |
          set -euo pipefail
          VOL="nw-ci-smoke-$$"
          CID=""
          cleanup() {
            if [ -n "${CID}" ]; then docker rm -f "${CID}" >/dev/null 2>&1 || true; fi
            docker volume rm -f "${VOL}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "${VOL}" >/dev/null
          CID="$(docker run -d \
            --name "nw-smoke-$$" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,size=64m \
            -v "${VOL}:/app/data" \
            -p 18080:8080 \
            -e APP_ENV=production \
            -e APP_SECRET_KEY= \
            -e UNIFI_MOCK_MODE=true \
            -e DATABASE_URL=sqlite:////app/data/netwatcher.db \
            unifi-netwatcher:ci-smoke)"
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18080/readyz" >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs "${CID}" || true
              echo "readyz did not become healthy" >&2
              exit 1
            fi
            sleep 1
          done
          docker run --rm -v "${VOL}:/data:ro" busybox:1.36 \
            test -f /data/app-secret.key
          echo "smoke ok"

  actions-lint:
    name: actions-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run zizmor
        run: uvx zizmor@1.9.0 .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
