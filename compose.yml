services:
  unifi-netwatcher:
    image: ghcr.io/andrewtryder/unifi-netwatcher:latest
    container_name: unifi-netwatcher
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
